<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Untitled</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="css/normalize.css" rel="stylesheet">
        <link href="css/styles.css" rel="stylesheet">
        <script src="js/scripts.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Untitled</h1>
        </header>
        <main>
            <form>
                <label for="search">Enter the Name of a Pokemon</label>
                <input type="text" id="search">
                <button type="submit" id="submitbtn">Search</button>
            </form>
            <div id="information">
                <h2 id="name"></h2>
                <img id="sprite"/>
                <p id="type1"></p>
                <p id="type2"></p>
                <p id="ability"></p>
                <div id="stats">
                    <p id="hp"></p>
                    <p id="atk"></p>
                    <p id="def"></p>
                    <p id="spatk"></p>
                    <p id="spdef"></p>
                    <p id="spd"></p>
                </div>
            </div>
        </main>
        <footer>
            <!-- Footer will dynamically add Student ID and Name using Javascript -->
        </footer>
    </body>
</html>
